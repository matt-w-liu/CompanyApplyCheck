<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Resume Directory</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 48px 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fafafa;
      }

      main {
        max-width: 420px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 16px;
        color: #666;
        font-size: 13px;
        line-height: 1.4;
      }

      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        background: #1976d2;
        color: white;
        transition: background 0.15s;
      }

      button:hover:not(:disabled) {
        background: #1565c0;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
      }

      .message.success {
        display: block;
        background: #e8f5e9;
        color: #1b5e20;
      }

      .message.error {
        display: block;
        background: #ffebee;
        color: #b71c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Select Resume Directory</h1>
      <p class="subtitle">
        Choose your resume folder. Each subfolder or pdf file name is treated as a
        company you've already applied to. This tab closes automatically when done.
      </p>

      <button id="pickBtn" type="button">Choose Folder</button>
      <div class="message" id="message"></div>
    </main>

    <script src="storage.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
